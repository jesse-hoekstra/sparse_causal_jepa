# Packaging + all tool configuration in one place (ruff, pyright, pytest).

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scjepa"
version = "0.1.0"
description = "Framewise state and context-parameter learning with sparse finite-lag dynamics"
readme = "README.md"
authors = [{ name = "Jesse Hoekstra" }]
# A single Python minor version keeps development environments reproducible.
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch>=2.9,<3.0",
    "hydra-core>=1.3.2,<1.4",
    "numpy>=1.26,<3",
    "jaxtyping>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<0.13",
    "pyright>=1.1.403",
    "pytest>=8.3,<9",
    "pre-commit>=4.0,<5",
]
logging = ["wandb>=0.19"]
analysis = ["scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["scjepa*", "diagnostics*"]

[tool.setuptools.package-data]
"scjepa.third_party" = ["**/*.md", "**/LICENSE*"]

# ---------------------------------------------------------------- ruff ------
[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored code is exempt from lint/format gates; keep upstream diffs minimal.
extend-exclude = ["third_party", "tmp"]

[tool.ruff.lint]
# Broad rule set (quality bar shared by all agents): pyflakes/pycodestyle, imports,
# modernization, bugbear, simplification, docstrings, annotations, pytest style.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "D",        # pydocstyle — docstrings on public API
    "ANN",      # flake8-annotations — full typing, incl. shape-annotated tensors
    "PT",       # pytest style
    "RET",      # return statements
    "ARG",      # unused arguments
    "TID",      # tidy imports
    "NPY",      # numpy pitfalls
]
ignore = [
    # jaxtyping shape strings (Float[Tensor, "b n d"]) parse as forward references
    # and trip F722; ignoring it is the documented jaxtyping recommendation.
    "F722",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["scjepa"]

[tool.ruff.lint.per-file-ignores]
# Tests: docstrings on every test function add noise, not information.
"tests/**" = ["D100", "D103", "D104"]
# -------------------------------------------------------------- pyright -----
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Resolve imports against the project venv (created as .venv per README quickstart);
# without this, pyright falls back to the ambient interpreter, which lacks torch.
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts", "diagnostics"]
# Vendored code is exempt from type gates; wrappers in src/ are fully typed.
exclude = ["**/third_party", "**/.venv", "**/__pycache__"]

# --------------------------------------------------------------- pytest -----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
