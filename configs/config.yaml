# ROOT config for scripts/train.py — Hydra loads this by name, then overlays an
# experiment preset on top (`defaults: [_self_, experiment: null]`, _self_ FIRST):
#   python scripts/train.py experiment=bounce_baumgartner ...
#
# Read this carefully before assuming a value lives in the experiment preset.
# Only the RUN SIZE below is a tiny CPU sanity scale (steps, batch_size and
# num_clips). Everything else here is a real protocol setting inherited by the
# paper-scale runs unless their experiment preset explicitly overrides it:
#   * the entire `model:` section — bounce_baumgartner overrides NONE of it, so
#     spartan_embed_dim/layers/num_slots here ARE the paper architecture;
#   * the physics in `data:` — num_balls, radius, mass_normal, speed, ...;
#   * the optimizer and dual in `train:` — lr, grad_clip, sparsity_step_size,
#     sparsity_momentum, sparsity_lambda_init.
#
# TWO KEYS ARE MANDATORY (`???`) AND HAVE NO DEFAULT ON PURPOSE. Both are
# per-run decisions whose wrong value is silent rather than loud, so Hydra is
# made to refuse the run instead of picking for you:
#   * `train.lambda_logit` — a default of 0 would disable the attention-logit
#     penalty in BOTH the objective and the dual constraint. Choose it from the
#     label-free dense sweep (scripts/isambard_logit_sweep.sbatch); pass 0.0
#     explicitly to run the no-penalty ablation deliberately.
#   * `train.sparsity_tau` — supplied by the relevant experiment pipeline from
#     matched held-out references. Experiment 1 uses a fixed multiplier ladder
#     with dense and identity references. It is read
#     ONLY when `sparsity_enabled=true`, so dense/token-local reference stages
#     run without supplying it.
# Every run prints a RUN CONFIGURATION banner naming the source of each
# decision-critical key, and `resolved_config.yaml` in the run dir is the record.

defaults:
  - _self_
  - experiment: null

model:
  state_dim: 4 # k = [x, y, vx, vy] (Eq. 1)
  num_slots: 5 # N balls = N state tokens = N parameter tokens (Eq. 29)
  param_encoder_dim: 32 # d (Eq. 16)
  param_encoder_heads: 4 # H (Eq. 18)
  max_history: 64 # learned temporal-PE table length (>= Tpar)
  spartan_layers: 3 # L_sp (§6.2)
  spartan_embed_dim: 512 # D_sp (Eq. 27)
  spartan_mlp_hidden: 512 # Eq. 36: three 512-wide linears
  spartan_mlp_layers: 3
  spartan_temperature: 1.0 # tau_g (Eq. 33)
  spartan_dense: false # A≡1: the fully connected tau-calibration reference
  spartan_identity: false # A≡0: the token-local reference

data:
  name: bounce
  num_clips: 64 # paper scale: 100000 (set in the experiment preset)
  clip_len: 60 # T; keeps the T=2 training and K=30 eval contracts valid
  seed: 0
  num_balls: 5
  resolution: 64
  radius: 0.08 # r0 (Eq. 2)
  mass_range: [0.5, 3.0] # clip bounds (Eq. 2)
  mass_normal: [1.5, 0.5] # m = clip(1.5 + 0.5*eps) (Eq. 2)
  radius_from_mass: true # r_i = r0 * m_i / m_ref (Eq. 2)
  speed: 0.7 # |v0| (Eq. 3)
  render: false # Experiment 1 sets rendering off (§6.1.1)
  cache: true
  preload: null # scripts/pregenerate_bounce.py file for the train split

train:
  steps: 200
  batch_size: 4
  lr: 5.0e-5 # SPARTAN App. A.1 (Adam)
  grad_clip: 1.0
  sparsity_enabled: true # false: dense / token-local references
  sparsity_tau: ??? # MANDATORY: calibrated from the experiment's held-out references.
  # Read only when sparsity_enabled=true, so reference stages omit it.
  sparsity_step_size: 2.0e-2 # alpha, the one numerical knob the papers leave open
  sparsity_lambda_init: 1.0e6 # §6.1.3: lambda starts at 1e6 (path weight 1e-6)
  sparsity_momentum: 0.99 # moving average of c - tau
  lambda_logit: ??? # MANDATORY: from the label-free dense sweep (§6.1.3).
  # No default: 0.0 would silently disable the penalty in objective AND bound.
  # Fixed state-to-state predictive objective:
  #   L_pred = L_TF + lambda_rollout_t2 * L_AR2.
  # Eight distinct valid offsets are sampled independently per episode. Each
  # window starts at a true state, feeds back one generated prediction, and
  # supervises only its second prediction. There is no horizon schedule.
  lambda_rollout_t2: 1.0
  num_rollout_t2_anchors: 8
  rollout_t2_horizon: 2 # validated as exactly two
  # Separate no-gradient held-out trajectory diagnostic. The fixed training-set
  # coordinate standard deviations are computed once by scripts/train.py and
  # persisted as train.oe_coordinate_std in resolved_config.yaml.
  oe_eval_horizon: 30
  oe_tolerance_nrmse: 0.10
  oe_coordinate_std: null
  # Experiment 3's independently specified latent-space objective uses these
  # visual-only fields. They remain disabled in the state-to-state regime.
  visual_rollout_len: null
  lambda_visual_rollout: 0.0
  seed: 0
  device: cpu
  context_len: 30 # Tpar (Eq. 17)
  eval_every: null # periodic held-out identifiability eval
  eval_episodes: 128
  # D18 grad-spike guards (run health, not objective): skip the update when
  # the pre-clip grad norm is non-finite or absurd; raise when persistent.
  grad_skip_threshold: 1.0e3
  grad_skip_max_consecutive: 2000
  log_every: 10
  checkpoint_every: 200
  checkpoint_keep_every: null

wandb:
  enabled: false
  project: sparse-causal-jepa
  mode: online
  run_tag: null
