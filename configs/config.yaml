# Small generic defaults, not a scientific experiment or recommended schedule.
defaults:
  - _self_
  - data: null
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
model:
  observation_kind: vector
  observation_dim: 8
  in_channels: 3
  encoder_hidden_dims: [64, 64]
  image_channels: [16, 32, 64]
  image_pool_size: 2
  state_dim: 6
  param_dim: 3
  action_dim: 0
  context_len: 4
  history_len: 2
  parameter_embed_dim: 64
  parameter_heads: 4
  max_context_len: 64
  spartan_layers: 2
  spartan_embed_dim: 64
  spartan_mlp_hidden: 64
  spartan_mlp_layers: 3
  spartan_temperature: 1.0
  spartan_dense: false
  spartan_identity: false
  spartan_parameter_gates_open: false
  ema_decay: 0.996

# Choose a lazy DGP with data=controlled_vector or data=coupled_springs,
# or supply data_path to a tensor file or a versioned bundle.
data: null
data_path: null
resume: null
# CLI training logs to W&B; direct Trainer/smoke usage remains local.
wandb:
  mode: ${oc.env:WANDB_MODE,online}
  project: ${oc.env:WANDB_PROJECT,null}
  entity: ${oc.env:WANDB_ENTITY,null}
  name: null
  group: null
  tags: []
  job_type: train
train:
  steps: 1
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  accumulation_steps: 1
  seed: 0
  device: cpu
  num_workers: 0
  log_every: 1
  checkpoint_every: null
  out_dir: outputs/generic
  geco:
    enabled: false
    tau: null
    step_size: 0.1
    momentum: 0.99
    lambda_init: 1000.0
    log_lambda_min: -12.0
    log_lambda_max: 12.0
  objective:
    state_sparsity_weight: 0.0
    action_sparsity_weight: 0.0
    parameter_sparsity_weight: 0.0
    logit_weight: 0.0
    state_regularizer: none
    state_regularizer_weight: 0.0
    parameter_regularizer: none
    parameter_regularizer_weight: 0.0
    regularizer_num_projections: 256

hydra:
  run:
    dir: .
  output_subdir: null
