# Dense tau calibration followed by two paired GECO runs. Numeric defaults are untuned.
name: complementary-geco
output_dir: outputs/complementary_geco
graphs: [complementary]
seeds: [0]
train_episodes: 8192
trajectory_length: 16
data_seed: 0
observation_seed: 1729
validation_every: 1000
tau_multiplier: 1.0
upload_evaluation_artifacts: false
model:
  observation_kind: vector
  observation_dim: 10
  state_dim: 10
  param_dim: 10
  action_dim: 10
  context_len: 2
  history_len: 1
  encoder_hidden_dims: [64, 64]
  parameter_embed_dim: 64
  parameter_heads: 4
  spartan_layers: 2
  spartan_embed_dim: 64
  spartan_mlp_hidden: 64
  spartan_mlp_layers: 3
  ema_decay: 0.996
train:
  steps: 10000
  batch_size: 64
  accumulation_steps: 1
  device: cpu
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  checkpoint_every: 250
  log_every: 100
  geco:
    # Enabled automatically for baseline/full; tau is read from the dense run.
    enabled: false
    tau: null
    step_size: 0.1
    momentum: 0.99
    lambda_init: 1000.0
    log_lambda_min: -12.0
    log_lambda_max: 12.0
  objective:
    # Relative block weights; GECO controls their common effective strength.
    state_sparsity_weight: 1.0
    action_sparsity_weight: 1.0
    parameter_sparsity_weight: 1.0 # baseline sets only this to zero
    logit_weight: 0.0001
    state_regularizer: sigreg
    state_regularizer_weight: 0.1
    parameter_regularizer: sigreg
    parameter_regularizer_weight: 0.1
    regularizer_num_projections: 256
evaluation:
  calibration_episodes: 512
  validation_episodes: 256
  test_episodes: 512
  batch_size: 64
  seed: 42
  graph_support_threshold: 0.0
wandb:
  mode: ${oc.env:WANDB_MODE,online}
  project: ${oc.env:WANDB_PROJECT,null}
  entity: ${oc.env:WANDB_ENTITY,null}
  group: complementary-geco
  job_type: controlled-experiment
  tags: [complementary, geco]
