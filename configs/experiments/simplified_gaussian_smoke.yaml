# Tiny CPU infrastructure check; its recovery metrics are not scientific results.
name: simplified-gaussian-m3-k10-action-smoke
output_dir: outputs/simplified_gaussian_m3_k10_action_smoke
data_family: simplified_gaussian
graphs: [complementary]
seeds: [0]
train_episodes: 8
trajectory_length: 12
episodes_per_parameter: 2
validation_every: 1
model:
  observation_dim: 6
  state_dim: 6
  param_dim: 6
  action_dim: 16
  context_len: 10
  autoregressive: true
  encoder_hidden_dims: [8]
  parameter_embed_dim: 8
  parameter_heads: 2
  spartan_layers: 1
  spartan_embed_dim: 8
  spartan_mlp_hidden: 8
  spartan_mlp_layers: 2
train:
  steps: 2
  batch_size: 4
  device: cpu
  lr: 0.001
  lr_final_ratio: 1.0
  checkpoint_every: 1
  log_every: 1
  objective:
    action_sparsity_weight: 1.0
    regularizer_num_projections: 4
evaluation:
  calibration_episodes: 4
  validation_episodes: 4
  test_episodes: 4
  batch_size: 4
wandb:
  mode: ${oc.env:WANDB_MODE,offline}
  project: ${oc.env:WANDB_PROJECT,null}
  entity: ${oc.env:WANDB_ENTITY,null}
  group: simplified-gaussian-m3-k10-action-smoke
  job_type: smoke
