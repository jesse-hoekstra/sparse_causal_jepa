# @package _global_
# Two-reflection mixing and radial Gaussian rotations; K=3, T=5 and L=1.
data:
  family: independent_gaussian
  parameter_graph: complementary
  root_seed: 0
  split: train
  num_episodes: 8
  episodes_per_parameter: 2
  trajectory_length: 5
  dtype: float32
  observation_seed: 1729
model:
  observation_kind: vector
  observation_dim: 10
  state_dim: 10
  param_dim: 10
  action_dim: 10
  history_len: 1
  context_len: 3
  autoregressive: true
