# @package _global_
# Six-state row/column mechanisms; observed actions mix Gaussian/uniform controls.
data:
  family: simplified_gaussian
  parameter_graph: complementary
  root_seed: 0
  split: train
  num_episodes: 8
  episodes_per_parameter: 2
  trajectory_length: 12
  dtype: float32
  observation_seed: 1729
model:
  observation_kind: vector
  observation_dim: 6
  state_dim: 6
  param_dim: 6
  action_dim: 16
  history_len: 1
  context_len: 10
  autoregressive: true
