# @package _global_
# Paper dynamics, dimensions, native renderer and eight-frame context.
# Gaussian scales, appearance values, episode count, length and seed are explicit choices.
data:
  family: coupled_springs
  parameter_graph: diagonal
  root_seed: 0
  split: train
  num_episodes: 8
  trajectory_length: 16
  dtype: float32
  position_mean: 0.0
  position_std: 1.0
  velocity_mean: 0.0
  velocity_std: 1.0
  renderer:
    sigma: 3.0
    amplitude: 1.0
    track_y: [20.0, 44.0]
model:
  observation_kind: image
  in_channels: 3
  state_dim: 10
  param_dim: 10
  action_dim: 5
  history_len: 2
  context_len: 8
