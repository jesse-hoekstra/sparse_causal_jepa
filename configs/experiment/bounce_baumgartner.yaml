# @package _global_
# Experiment 1 at paper scale (experiments.pdf §6.1–6.2): true-state context,
# true-state target, 5-ball Bounce v2 with mass-proportional physical radii.
# tau and lambda_logit are NOT set here: lambda_logit comes from the label-free
# dense sweep (§6.1.3; scripts/isambard_logit_sweep.sbatch + summarize), tau is
# recalibrated by the pipeline as 1.0x the held-out constraint of the converged
# dense reference (scripts/run_bounce_example.sh / isambard_pipeline.sbatch).

data:
  num_clips: 100000 # 3M unique transitions; rescale if capacity/steps change
  clip_len: 60 # T (§6.1.1)
  preload: data/bounce_train_v2_100000.pt

train:
  # Attempted-batch stop. A healthy zero-skip D36 run spends 115k accepted
  # updates reaching the terminal gradient and 240k at full K=30 BPTT.
  steps: 355000
  batch_size: 16 # x30 teacher-forced transitions per episode
  context_len: 30 # Tpar (Eq. 17); I_TF = {29, ..., 58}
  # Hybrid rollout branch (write-up Eqs. 33-35): ONE chain anchored at the
  # first prediction time t = Tpar-1 = 29, rolled out over the whole window to
  # t+K = 59 = T-1. K = 30 fits the existing 60-step clips exactly, so it needs
  # no change to the preload. This is the closest analogue to Baumgartner's
  # L_rec, which reconstructs the entire trajectory autoregressively from one
  # initial condition (their Eq. 2 / §3.3).
  # Short CPU smokes did not expose the long-run instability: fixed K=30, and
  # then K=30 with a linear lambda_roll warmup, both entered recurrent-gradient
  # explosions followed by sustained rejected updates. The curriculum below
  # therefore changes BPTT depth while keeping the live coefficient fixed.
  rollout_len: 30
  lambda_roll: 1.0
  # D36 rollout continuation, indexed only by ACCEPTED optimizer updates.
  # First train three true-anchored windows spanning the early/middle/late
  # suffix. Then evaluate ONE continuous full-K=30 forward trajectory while
  # removing feedback-gradient cuts: 10 -> 15 -> 20 -> 25 -> 30 BPTT depth.
  # detach is applied only after saving a boundary prediction; it never resets
  # the value to ground truth and never detaches the shared theta_hat.
  # lambda_roll remains exactly 1 whenever the branch is live.
  rollout_curriculum:
    - {start_update: 0, rollout_len: null, rollout_starts: [], gradient_cuts: []}
    - {start_update: 10000, rollout_len: 2, rollout_starts: [0, 10, 20], gradient_cuts: []}
    - {start_update: 20000, rollout_len: 5, rollout_starts: [0, 10, 20], gradient_cuts: []}
    - {start_update: 30000, rollout_len: 10, rollout_starts: [0, 10, 20], gradient_cuts: []}
    - {start_update: 50000, rollout_len: 30, rollout_starts: [0], gradient_cuts: [10, 20]}
    - {start_update: 70000, rollout_len: 30, rollout_starts: [0], gradient_cuts: [15]}
    - {start_update: 85000, rollout_len: 30, rollout_starts: [0], gradient_cuts: [20]}
    - {start_update: 100000, rollout_len: 30, rollout_starts: [0], gradient_cuts: [25]}
    - {start_update: 115000, rollout_len: 30, rollout_starts: [0], gradient_cuts: []}
  eval_every: 5000 # a metric that CAN leave its failure value MUST be watched
  log_every: 100
  # A stalled accepted-update clock cannot advance out of an unstable horizon.
  # Fail quickly and restore the checkpoint saved at the preceding boundary.
  grad_skip_max_consecutive: 50
  checkpoint_every: 2000
  checkpoint_keep_every: 25000 # D18 rolling fallbacks
