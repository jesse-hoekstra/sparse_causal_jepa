# @package _global_
# Experiment 1 at paper scale (experiments.pdf §6.1–6.2): true-state context,
# true-state target, 5-ball Bounce v2 with mass-proportional physical radii.
# tau and lambda_logit are NOT set here: lambda_logit comes from the label-free
# dense sweep (§6.1.3; scripts/isambard_logit_sweep.sbatch + summarize), tau is
# recalibrated by the pipeline as 1.0x the held-out constraint of the converged
# dense reference (scripts/run_bounce_example.sh / isambard_pipeline.sbatch).

data:
  num_clips: 100000 # 3M unique transitions; rescale if capacity/steps change
  clip_len: 60 # T (§6.1.1)
  preload: data/bounce_train_v2_100000.pt

train:
  # Return to the successful pure-teacher-forcing run length and optimizer
  # foundation (D30); tau is still recalibrated for the new T=2 objective.
  steps: 300000
  batch_size: 16 # x30 teacher-forced transitions per episode
  context_len: 30 # Tpar (Eq. 17); I_TF = {29, ..., 58}
  # Eight local T=2 rollouts per episode. For C=30/T=60, each episode samples
  # eight distinct offsets from 0..28, independently and without replacement.
  lambda_rollout_t2: 1.0
  num_rollout_t2_anchors: 8
  rollout_t2_horizon: 2
  # The K=30 chain is evaluation-only and runs under torch.no_grad().
  oe_eval_horizon: 30
  oe_tolerance_nrmse: 0.10
  # Successful run 7cq3h2ur used these values. The old tau=0.02 is deliberately
  # not restored: the dense pipeline must recalibrate the new TF+T2 constraint.
  lambda_logit: 1.0e-5
  sparsity_lambda_init: 1.0e4
  eval_every: 5000 # a metric that CAN leave its failure value MUST be watched
  log_every: 100
  grad_skip_max_consecutive: 2000
  checkpoint_every: 2000
  checkpoint_keep_every: 25000 # D18 rolling fallbacks
