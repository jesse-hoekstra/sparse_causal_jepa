# @package _global_
# Experiment 1 at paper scale (experiments.pdf §6.1–6.2): true-state context,
# true-state target, 5-ball Bounce v2 with mass-proportional physical radii.
# tau and lambda_logit are NOT set here: lambda_logit comes from the label-free
# dense sweep (§6.1.3; scripts/isambard_logit_sweep.sbatch + summarize), tau is
# recalibrated by the pipeline as 1.0x the held-out constraint of the converged
# dense reference (scripts/run_bounce_example.sh / isambard_pipeline.sbatch).

data:
  num_clips: 100000 # 3M unique transitions; rescale if capacity/steps change
  clip_len: 60 # T (§6.1.1)
  preload: data/bounce_train_v2_100000.pt

train:
  steps: 300000 # Baumgartner Fig. 17 scale
  batch_size: 16 # x30 teacher-forced transitions per episode
  context_len: 30 # Tpar (Eq. 17); I_TF = {29, ..., 58}
  # Hybrid rollout branch (write-up Eqs. 33-35): ONE chain anchored at the
  # first prediction time t = Tpar-1 = 29, rolled out over the whole window to
  # t+K = 59 = T-1. K = 30 fits the existing 60-step clips exactly, so it needs
  # no change to the preload. This is the closest analogue to Baumgartner's
  # L_rec, which reconstructs the entire trajectory autoregressively from one
  # initial condition (their Eq. 2 / §3.3).
  # Measured (1500-step CPU smoke, paper geometry): per-step error rises to
  # ~0.11 at k~19 then FALLS to 0.092 by k=30 — bounded state space, so depth
  # does not compound. grad_norm max 4.43, zero skipped steps.
  rollout_len: 30
  lambda_roll: 1.0
  # The successful pure-TF run reached its early one-step plateau (~0.04 MSE)
  # around step 1k and continued settling through 10k. The first full-weight
  # K=30 run instead entered an irreversible BPTT explosion around step 630.
  # Ramp linearly from 0 to lambda_roll over 10k updates: the dangerous early
  # point sees only ~6% rollout weight, while the full objective is restored
  # long before the sparsification phases.
  lambda_roll_warmup_steps: 10000
  eval_every: 5000 # a metric that CAN leave its failure value MUST be watched
  log_every: 100
  checkpoint_every: 2000
  checkpoint_keep_every: 25000 # D18 rolling fallbacks
