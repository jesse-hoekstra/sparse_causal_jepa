# @package _global_
# Experiment 2: learn object states from anonymous frames, with an EMA target.
# Extension of Experiment 1 using the same physics and TF + endpoint-only T=2
# objective. True states, masses, contacts and identities are evaluation-only.
# See docs/decisions.md D39/D42 for departures from the historical experiments PDF.

data:
  num_clips: 100000
  clip_len: 60
  preload: data/bounce_train_v2_100000.pt
  render: true
  resolution: 64
  render_radius_from_mass: false
  uniform_appearance: true
  mass_independent_init: false
  cache: false # do not retain ~18 MB of rendered frames per episode

model:
  regime: visual_to_visual
  num_slots: 5
  slot_size: 32
  latent_state_dim: 32
  resolution: 64
  ema_decay: 0.996

train:
  steps: 300000
  batch_size: 4 # global batch; torchrun divides it across GPUs (two per GPU on two L40s)
  context_len: 30
  lambda_logit: 1.0e-5 # Experiment-1 starting value, not a visual sweep result
  sparsity_lambda_init: 1.0e4
  lambda_rollout_t2: 1.0
  num_rollout_t2_anchors: 8
  rollout_t2_horizon: 2
  oe_eval_horizon: 30 # open-loop latent diagnostic only; no long BPTT
  # Raw TF + T=2 + logit constraint, as in Experiment 1; variance is diagnostic.
  # Freshly calibrate tau: old variance-normalized thresholds cannot be reused.
  num_workers: 8
  prefetch_factor: 2
  eval_every: 5000
  eval_episodes: 128
  log_every: 100
  checkpoint_every: 2000
  checkpoint_keep_every: 25000
